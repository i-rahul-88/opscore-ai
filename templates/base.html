<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpsCore AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #020817;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(120,119,198,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0,212,255,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .navbar {
            background: rgba(2,8,23,0.8) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 15px 0;
        }

        .navbar-brand {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7877c6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-btn {
            color: #94a3b8 !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 8px !important;
            padding: 6px 16px !important;
            font-size: 0.85rem !important;
            transition: all 0.3s !important;
        }

        .nav-btn:hover {
            background: rgba(0,212,255,0.1) !important;
            border-color: #00d4ff !important;
            color: #00d4ff !important;
        }

        .container { position: relative; z-index: 1; }

        .glass-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(0,212,255,0.3);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #7877c6) !important;
            border: none !important;
            border-radius: 10px !important;
            font-weight: 600 !important;
            padding: 12px 30px !important;
            transition: all 0.3s !important;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,212,255,0.3) !important;
        }

        .badge-agent {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        textarea.form-control {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 12px !important;
            color: #e2e8f0 !important;
            font-size: 0.95rem !important;
            padding: 15px !important;
            transition: all 0.3s !important;
        }

        textarea.form-control:focus {
            border-color: #00d4ff !important;
            box-shadow: 0 0 0 3px rgba(0,212,255,0.1) !important;
            background: rgba(255,255,255,0.07) !important;
        }

        .response-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 12px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.88rem;
            line-height: 1.7;
            white-space: pre-wrap;
            color: #a8d8a8;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(0,212,255,0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="fas fa-robot me-2"></i>OpsCore AI
        </a>
        <div class="d-flex gap-2">
            <a href="/" class="btn nav-btn">
                <i class="fas fa-home me-1"></i>Home
            </a>
            <a href="/agents/chat/" class="btn nav-btn">
                <i class="fas fa-comments me-1"></i>Chat
            </a>
            <a href="/agents/history/" class="btn nav-btn">
                <i class="fas fa-history me-1"></i>History
            </a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
